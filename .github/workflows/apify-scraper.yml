name: Competitor Social Report Scraper
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Apify scraper
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: python3 scripts/apify_scraper.py > apify_results.json
      - name: Commit results
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apify_results.json
          git diff --staged --quiet || git commit -m "data: competitor social media scrape $(date -u +%Y-%m-%d)"
          git push
